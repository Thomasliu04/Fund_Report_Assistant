# 全册 slide map — templates/25H1_template.pptx（10 页）
# 表均为贴图；按第 2 页同款：文字整段替换 + PNG 表图（数据条/色阶）等比适配

template: templates/25H1_template.pptx
slide_size: [13.33, 7.50]

slides:
